<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Mojimo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/mojimo-icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --text: #1b1b1f;
      --muted: #5f6068;
      --border: #e6e5e0;
      --accent: #2f7fe6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --text: #ececee;
        --muted: #a0a1a8;
        --border: #2c2c32;
        --accent: #5b9df0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    a { color: var(--accent); }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 20px 48px;
    }
    .top { padding: 20px 0; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .brand img { width: 32px; height: 32px; border-radius: 8px; display: block; }
    .hero { text-align: center; padding: 56px 0 64px; }
    .hero .icon {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      display: block;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 2.5rem;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 16px;
    }
    .lead {
      color: var(--muted);
      font-size: 1.15rem;
      max-width: 520px;
      margin: 0 auto 24px;
    }
    .links { display: flex; justify-content: center; gap: 24px; font-weight: 500; }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    footer a { color: var(--muted); }
    @media (max-width: 640px) {
      h1 { font-size: 2rem; }
      .lead { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <a class="brand" href="/"><img src="/assets/mojimo-icon-64.png" alt="" width="32" height="32">Mojimo</a>
    </header>

    <div class="hero">
      <img class="icon" src="/assets/mojimo-icon.png" alt="" width="112" height="112">
      <h1>Page not found</h1>
      <p class="lead">The page you're looking for doesn't exist or has moved.</p>
      <div class="links">
        <a href="/">Mojimo home</a>
        <a href="/legal/">Support</a>
      </div>
    </div>

    <footer>
      © 2026 <a href="https://teeendvn.com/">TeeEndVN</a>
    </footer>
  </main>
</body>
</html>
